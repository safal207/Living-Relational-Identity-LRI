name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r lri-reference/requirements.txt
          pip install pyyaml ruff black
      - name: make lint
        run: make lint
      - name: make format
        run: make format
      - name: make all
        run: make all
